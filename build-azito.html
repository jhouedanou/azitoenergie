<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Build Azito — Azito Energie</title>
  <meta name="theme-color" content="#1b1c55">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@500;700&display=swap">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="gamepage" data-page="build">
  <header class="topbar">
    <a class="logo" href="index.html" aria-label="Azito Energie — accueil">
      <img src="assets/logo/azito-energie-blanc.png" alt="Azito Energie" width="1342" height="305">
    </a>
    <p class="topbar__title">Build Azito</p>
    <div class="topbar__actions">
      <div class="timer" id="timer" role="timer" aria-label="Secondes restantes">
        <svg class="timer__ring" viewBox="0 0 52 52" aria-hidden="true">
          <circle class="track" cx="26" cy="26" r="22"/>
          <circle class="bar" id="timer-bar" cx="26" cy="26" r="22"/>
        </svg>
        <span id="timer-text">30</span><small>s</small>
      </div>
      <button class="iconbtn" type="button" data-fullscreen aria-label="Plein écran">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </header>

  <!-- Choix du puzzle -->
  <main class="picker" id="picker">
    <h1>Choisis l’image <em>à reconstituer</em></h1>
    <p class="picker__note">8 pièces, 30 secondes. Glisse chaque pièce à sa place : elle s’aimante quand elle est bien posée. Le chrono part dès que tu touches une image.</p>
    <div class="picker__grid" id="grid"></div>
  </main>

  <!-- Jeu -->
  <main class="build" id="build" hidden>
    <div class="build__bar">
      <button class="btn btn--sm btn--ghostOnDark" type="button" id="back"><span>Changer d’image</span></button>
      <div class="build__progress" aria-hidden="true"><i id="progress"></i></div>
      <p class="build__count" id="count" aria-live="polite">0 / 8 <small>pièces</small></p>
    </div>
    <div class="build__canvas" id="canvas-wrap"><canvas id="canvas"></canvas></div>
  </main>

  <!-- Résultat -->
  <div class="overlay" id="result" hidden>
    <div class="panel">
      <h2 id="result-title"></h2>
      <p class="bigtime" id="result-time"></p>
      <p id="result-text"></p>
      <form class="nameform" id="nameform" autocomplete="off">
        <input id="name" name="name" type="text" maxlength="14" placeholder="Ton prénom ou pseudo" aria-label="Ton prénom ou pseudo" enterkeyhint="done">
        <button class="btn" type="submit"><span>Entrer au classement</span></button>
      </form>
      <div id="result-board"></div>
      <div class="panel__actions">
        <button class="btn btn--onDark" type="button" id="again"><span>Rejouer</span></button>
        <button class="btn btn--ghostOnDark" type="button" id="other"><span>Autre image</span></button>
        <a class="btn btn--ghostOnDark" href="index.html"><span>Accueil</span></a>
      </div>
    </div>
  </div>

  <script type="module" src="assets/js/kiosk.js"></script>
  <script type="module" src="assets/js/build-azito.js"></script>
</body>
</html>
