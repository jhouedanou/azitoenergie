<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Turbine Match, Azito Energie</title>
  <meta name="theme-color" content="#313280">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@500;700&display=swap">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <script type="importmap">{ "imports": { "three": "./assets/vendor/three.module.min.js" } }</script>
</head>
<body class="gamepage" data-page="match">
  <header class="topbar">
    <a class="logo" href="index.html" aria-label="Retour à l’accueil Azito Energie">
      <img src="assets/logo/azito-energie-blanc.png" alt="Azito Energie" width="1342" height="305">
    </a>
    <p class="topbar__title">Turbine Match <span id="level-label">Niveau 1</span></p>
    <div class="topbar__actions">
      <div class="timer" id="timer" role="timer" aria-label="Secondes restantes">
        <svg class="timer__ring" viewBox="0 0 52 52" aria-hidden="true">
          <circle class="track" cx="26" cy="26" r="22"/>
          <circle class="bar" id="timer-bar" cx="26" cy="26" r="22"/>
        </svg>
        <span id="timer-text">30</span><small>s</small>
      </div>
      <button class="iconbtn" type="button" data-fullscreen aria-label="Plein écran">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </header>

  <!-- Choix de la turbine : c'est aussi l'écran d'explication -->
  <main class="picker" id="picker">
    <h1>Choisis ta turbine</h1>
    <p class="picker__note">Tu as 10 secondes pour bien regarder la turbine. Ensuite elle disparaît et tu dois retrouver son schéma parmi les trois. Le chrono démarre dès que tu en touches une.</p>
    <div class="picker__grid picker__grid--4" id="grid"></div>
  </main>

  <main class="match" id="match" hidden>
    <div class="match__stage" id="stage"></div>

    <!-- Consigne pendant la manche -->
    <div class="match__bar" id="prompt">
      <b id="prompt-title">Mémorise la turbine</b>
      <p class="match__tip" id="prompt-tip"></p>
      <button class="btn btn--sm btn--onDark" type="button" id="ready"><span>Je suis prêt</span></button>
    </div>

    <!-- Verdict : il prend la place de la consigne et laisse les schémas visibles -->
    <div class="match__bar" id="verdict" role="status" hidden>
      <div class="verdict__text">
        <b id="verdict-title"></b>
        <p id="verdict-text"></p>
      </div>
      <div class="verdict__actions">
        <button class="btn btn--sm" type="button" id="again"><span>Rejouer</span></button>
        <button class="btn btn--sm btn--onDark" type="button" id="see"><span>Voir la différence</span></button>
        <button class="btn btn--sm btn--ghostOnDark" type="button" id="other"><span>Autre turbine</span></button>
        <a class="btn btn--sm btn--ghostOnDark" href="index.html"><span>Accueil</span></a>
      </div>
    </div>

    <div class="match__options" id="options">
      <button class="option" type="button" data-i="0" aria-label="Schéma A"><span class="option__letter">A</span><span class="option__mark" hidden></span></button>
      <button class="option" type="button" data-i="1" aria-label="Schéma B"><span class="option__letter">B</span><span class="option__mark" hidden></span></button>
      <button class="option" type="button" data-i="2" aria-label="Schéma C"><span class="option__letter">C</span><span class="option__mark" hidden></span></button>
    </div>
  </main>

  <script type="module" src="assets/js/kiosk.js"></script>
  <script type="module" src="assets/js/turbine-match.js"></script>
</body>
</html>
